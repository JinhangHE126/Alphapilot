name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphapilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check agent import boundaries
        run: |
          echo "🔍 Checking agents/ do not bypass data_collector..."
          FORBIDDEN=$(grep -rn '^from tools\.' alphapilot/agents/ | grep -v 'from tools\.data_collector' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ Agents must NOT import directly from tools.* (except tools.data_collector)"
            echo "   Forbidden imports found:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "✅ Agent import boundaries clean"
      - name: Unit tests
        run: pytest test/test_auth_sessions.py

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
