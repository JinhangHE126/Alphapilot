name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphapilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and test
        run: |
          ruff check .
          pytest test/test_auth_sessions.py

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/alphapilot-backend:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/alphapilot-frontend:${{ github.sha }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./alphapilot
          file: ./alphapilot/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/deploy.sh
          target: /tmp/alphapilot
      - name: Remote deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/alphapilot-backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/alphapilot-frontend:${{ github.sha }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          PROD_ENV_CONTENT: ${{ secrets.PROD_ENV_CONTENT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GIT_REPO,PROD_ENV_CONTENT
          script: |
            chmod +x /tmp/alphapilot/deploy/deploy.sh
            /tmp/alphapilot/deploy/deploy.sh
